name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Match tag to manifest
        run: node -e 'const version = require("./package.json").version; if (process.argv[1] !== `v${version}`) throw new Error(`Tag ${process.argv[1]} does not match version ${version}`)' "$GITHUB_REF_NAME"
      - run: bun run pack
      - name: Publish verified distribution
        run: gh release create "$GITHUB_REF_NAME" ./*.zip ./*.zip.sha256 --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
